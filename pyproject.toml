[build-system]
requires = [
    "hatchling>=1.5.0",
    "hatch-nodejs-version>=0.3.2",
    "jupyter-builder>=1.2.0,<2"
]
build-backend = "hatchling.build"

[project]
name = "jupyter-aiterminal"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "jupyterlab>=4.5,<5",
    "jupyter_server>=2.0",
    "claude-agent-sdk"
]
dynamic = ["version", "description", "authors", "keywords"]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "jupyterlab>=4.5,<5",
    "jupyter-builder>=1.2.0,<2",
    "pytest>=8.0"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "keywords"]

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/.yarn",
    "/coverage",
    "/dist",
    "/node_modules"
]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_aiterminal/labextension"]
exclude = [
    "/.pytest_cache",
    "/.yarn",
    "/coverage",
    "/dist",
    "/node_modules"
]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_aiterminal/labextension" = "share/jupyter/labextensions/jupyter-aiterminal"
"install.json" = "share/jupyter/labextensions/jupyter-aiterminal/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyter_aiterminal/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_aiterminal/labextension/static/style.js",
    "jupyter_aiterminal/labextension/package.json"
]
skip-if-exists = ["jupyter_aiterminal/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_aiterminal/labextension"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.check-wheel-contents]
ignore = ["W002"]
